<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CosmicTalks — connected star wheel</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, "Avenir Next", "Segoe UI", sans-serif; background: #eceae4; color: #16141f; }
    header { padding: 20px 28px; background: #fff; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.03em; }
    p { margin: 0; color: #5c5870; font-size: 13px; max-width: 72ch; line-height: 1.45; }
    .row { display: flex; }
    .col { flex: 1; min-height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .col h2 { margin: 0 0 14px; font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
    .navy { background: #0B0F1F; color: #c9c6d4; }
    .white { background: #fff; }
    img { width: min(340px, 88%); height: auto; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Connected star wheel — CosmicTalks colors</h1>
    <p>Exact reference structure: empty hexagon, one six-pointed star, ring through 12 sign beads, spokes into the other six beads. CosmicTalks gradient and wordmark only. Not deployed.</p>
  </header>
  <div class="row">
    <div class="col white">
      <h2>Your reference</h2>
      <img src="_ref-icon.png" alt="Navy geometric reference" />
    </div>
    <div class="col white">
      <h2>Ours on light</h2>
      <img src="06-star-wheel-lockup.svg" alt="CosmicTalks star wheel lockup" />
    </div>
    <div class="col navy">
      <h2>Ours on navy</h2>
      <img src="06-star-wheel-lockup.svg" alt="CosmicTalks star wheel on navy" />
    </div>
  </div>
</body>
</html>
