<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #d8d4cc; font-family: ui-sans-serif, sans-serif; }
    .row { display: flex; align-items: stretch; border-bottom: 1px solid #bbb; }
    .label {
      width: 220px; padding: 16px 18px; background: #fff;
      display: flex; flex-direction: column; justify-content: center;
    }
    .label h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: -0.02em; }
    .label p { margin: 0; font-size: 12px; color: #5c5870; line-height: 1.35; }
    .navy, .white {
      width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
    }
    .navy { background: #0B0F1F; }
    .white { background: #fff; }
    .navy img, .white img { width: 168px; height: 168px; }
    .sizes { display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #eceae4; width: 280px; }
    .chip { display: flex; align-items: center; justify-content: center; border-radius: 5px; }
    .dn { background: #0B0F1F; }
    .lw { background: #fff; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <div class="row">
    <div class="label"><h2>1. Starred-ı</h2><p>Wordmark flourish as a standalone mark. Open orbit, not a zodiac ring.</p></div>
    <div class="navy"><img src="01-starred-i.svg" alt="" /></div>
    <div class="white"><img src="01-starred-i.svg" alt="" /></div>
    <div class="sizes">
      <div class="chip dn" style="width:40px;height:40px"><img src="01-starred-i.svg" width="28" height="28" alt="" /></div>
      <div class="chip lw" style="width:40px;height:40px"><img src="01-starred-i.svg" width="28" height="28" alt="" /></div>
      <div class="chip dn" style="width:22px;height:22px"><img src="01-starred-i.svg" width="16" height="16" alt="" /></div>
      <div class="chip lw" style="width:22px;height:22px"><img src="01-starred-i.svg" width="16" height="16" alt="" /></div>
    </div>
  </div>
  <div class="row">
    <div class="label"><h2>2. Comet + orbit</h2><p>One shooting star. Gradient trail = motion / conversation.</p></div>
    <div class="navy"><img src="02-comet-orbit.svg" alt="" /></div>
    <div class="white"><img src="02-comet-orbit.svg" alt="" /></div>
    <div class="sizes">
      <div class="chip dn" style="width:40px;height:40px"><img src="02-comet-orbit.svg" width="28" height="28" alt="" /></div>
      <div class="chip lw" style="width:40px;height:40px"><img src="02-comet-orbit.svg" width="28" height="28" alt="" /></div>
      <div class="chip dn" style="width:22px;height:22px"><img src="02-comet-orbit.svg" width="16" height="16" alt="" /></div>
      <div class="chip lw" style="width:22px;height:22px"><img src="02-comet-orbit.svg" width="16" height="16" alt="" /></div>
    </div>
  </div>
  <div class="row">
    <div class="label"><h2>3. Constellation</h2><p>Live Saptarishi geometry. Alkaid is the brand spark.</p></div>
    <div class="navy"><img src="03-constellation-node.svg" alt="" /></div>
    <div class="white"><img src="03-constellation-node.svg" alt="" /></div>
    <div class="sizes">
      <div class="chip dn" style="width:40px;height:40px"><img src="03-constellation-node.svg" width="28" height="28" alt="" /></div>
      <div class="chip lw" style="width:40px;height:40px"><img src="03-constellation-node.svg" width="28" height="28" alt="" /></div>
      <div class="chip dn" style="width:22px;height:22px"><img src="03-constellation-node.svg" width="16" height="16" alt="" /></div>
      <div class="chip lw" style="width:22px;height:22px"><img src="03-constellation-node.svg" width="16" height="16" alt="" /></div>
    </div>
  </div>
  <div class="row">
    <div class="label"><h2>4. Speech + star</h2><p>Name-literal: talk bubble + the same ✦.</p></div>
    <div class="navy"><img src="04-speech-star.svg" alt="" /></div>
    <div class="white"><img src="04-speech-star.svg" alt="" /></div>
    <div class="sizes">
      <div class="chip dn" style="width:40px;height:40px"><img src="04-speech-star.svg" width="28" height="28" alt="" /></div>
      <div class="chip lw" style="width:40px;height:40px"><img src="04-speech-star.svg" width="28" height="28" alt="" /></div>
      <div class="chip dn" style="width:22px;height:22px"><img src="04-speech-star.svg" width="16" height="16" alt="" /></div>
      <div class="chip lw" style="width:22px;height:22px"><img src="04-speech-star.svg" width="16" height="16" alt="" /></div>
    </div>
  </div>
</body>
</html>
