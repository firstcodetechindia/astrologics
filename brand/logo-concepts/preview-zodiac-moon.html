<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CosmicTalks — reference lockup in brand colors</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, "Avenir Next", "Segoe UI", sans-serif; background: #eceae4; color: #16141f; }
    header { padding: 22px 28px; background: #fff; border-bottom: 1px solid #ddd; }
    h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.03em; }
    p { margin: 0; color: #5c5870; font-size: 13px; max-width: 70ch; line-height: 1.45; }
    .row { display: flex; }
    .col { flex: 1; min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; }
    .col h2 { margin: 0 0 16px; font-size: 13px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }
    .navy { background: #0B0F1F; color: #c9c6d4; }
    .white { background: #fff; }
    .paper { background: #f7f4ee; }
    img { width: min(360px, 86%); height: auto; display: block; }
    .icon { width: 280px; }
  </style>
</head>
<body>
  <header>
    <h1>Reference lockup — CosmicTalks colors</h1>
    <p>Same structure as your upload: 12-sign beads, tick ring, right-opening crescent, three sparks. Brand gradient on every stroke. CosmicTalks + live tagline. Not deployed.</p>
  </header>
  <div class="row">
    <div class="col white">
      <h2>Your reference</h2>
      <img src="_reference.png" alt="Uploaded reference" />
    </div>
    <div class="col paper">
      <h2>Ours on light</h2>
      <img src="05-zodiac-moon-lockup.svg" alt="CosmicTalks lockup" />
    </div>
    <div class="col navy">
      <h2>Ours on navy</h2>
      <img src="05-zodiac-moon-lockup.svg" alt="CosmicTalks lockup on navy" />
    </div>
  </div>
</body>
</html>
