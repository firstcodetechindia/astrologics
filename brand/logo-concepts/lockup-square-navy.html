<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@600;700;800&display=swap");
    html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0F1F;
      font-family: Roboto, ui-sans-serif, system-ui, sans-serif;
    }
    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 860px;
    }
    .mark { width: 440px; height: 440px; display: block; margin-bottom: -36px; }
    .name {
      margin-top: 0;
      font-size: 92px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: #fff;
      white-space: nowrap;
      padding-top: 0.28em;
    }
    .i { position: relative; display: inline-block; padding: 0 0.01em; }
    .star {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, -42%);
      font-size: 0.42em;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.55);
    }
    .talks {
      background: linear-gradient(90deg, #6C3CFF 0%, #FF5CA8 32%, #FF8A3D 68%, #FFC857 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.05em;
      padding-bottom: 0.08em;
    }
    .tag {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="lockup">
    <img class="mark" src="from-photo/cosmictalks-mark.png" alt="" />
    <div class="name">Cosm<span class="i">ı<span class="star">✦</span></span>c<span class="talks">Talks</span></div>
    <div class="tag">Let’s Decode Your Stars</div>
  </div>
</body>
</html>
